apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.31.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: pv-linkding
              mountPath: /etc/linkding/data
      volumes:
        - name: pv-linkding
          persistentVolumeClaim:
            claimName: linkding-data-pvc
